components:
  schemas:
    CreateAccountRequest:
      title: CreateAccountRequest
      required:
      - username
      - fullName
      - password
      - email
      type: object
      properties:
        username:
          type: string
        fullName:
          type: string
        password:
          type: string
        email:
          type: string
      example:
        username: Arti001
        fullName: Arti Patel
        password: '123123'
        email: artipatel@gmail.com
    LoginRequest:
      title: LoginRequest
      required:
      - email
      - password
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      example:
        email: artipatel@gmail.com
        password: '1231234'
    ChangePasswordRequest:
      title: ChangePasswordRequest
      required:
      - email
      - password
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      example:
        email: artipatel@gmail.com
        password: '1231234'
    CreateGroupRequest:
      title: CreateGroupRequest
      required:
      - groupName
      - groupID
      - groupCapacity
      type: object
      properties:
        groupName:
          type: string
        groupID:
          type: integer
          format: int32
        groupCapacity:
          type: integer
          format: int32
      example:
        groupName: Maynooth English Literature
        groupID: 4
        groupCapacity: 5
    AddClauseRequest:
      title: AddClauseRequest
      required:
      - createdBy
      - clause
      - context
      - visibility
      type: object
      properties:
        createdBy:
          type: string
        clause:
          type: string
        context:
          type: string
        visibility:
          type: string
      example:
        createdBy: Arti@21250
        clause: May your work always bring you prosperity.
        context: Social
        visibility: public
    UpdateAClauseRequest:
      title: UpdateAClauseRequest
      required:
      - clause
      type: object
      properties:
        clause:
          type: string
      example:
        clause: This is updated clause...
    UpdateContextRequest:
      title: UpdateContextRequest
      required:
      - context
      type: object
      properties:
        context:
          type: string
      example:
        context: Testing
    GetAAnalysisRequest:
      title: GetAAnalysisRequest
      required:
      - clauseID
      type: object
      properties:
        clauseID:
          type: string
      example:
        clauseID: 6293c9116e42c551e0f4fd1f
    GenerateSFLRequest:
      title: GenerateSFLRequest
      required:
      - body
      type: object
      properties:
        body:
          type: array
          items:
            $ref: '#/components/schemas/Body'
          description: ''
      example:
        body:
        - Clause:
            ngp:
              dd:
                the: {}
              th:
                canvas: {}
              m|adjgp:
                t:
                  in: {}
                a:
                  the: {}
                th:
                  bedroom: {}
    Body:
      title: Body
      required:
      - Clause
      type: object
      properties:
        Clause:
          $ref: '#/components/schemas/Clause'
      example:
        Clause:
          ngp:
            dd:
              the: {}
            th:
              canvas: {}
            m|adjgp:
              t:
                in: {}
              a:
                the: {}
              th:
                bedroom: {}
    Clause:
      title: Clause
      required:
      - ngp
      type: object
      properties:
        ngp:
          $ref: '#/components/schemas/Ngp'
      example:
        ngp:
          dd:
            the: {}
          th:
            canvas: {}
          m|adjgp:
            t:
              in: {}
            a:
              the: {}
            th:
              bedroom: {}
    Ngp:
      title: Ngp
      required:
      - dd
      - th
      - m|adjgp
      type: object
      properties:
        dd:
          $ref: '#/components/schemas/Dd'
        th:
          $ref: '#/components/schemas/Th'
        m|adjgp:
          $ref: '#/components/schemas/MAdjgp'
      example:
        dd:
          the: {}
        th:
          canvas: {}
        m|adjgp:
          t:
            in: {}
          a:
            the: {}
          th:
            bedroom: {}
    Dd:
      title: Dd
      required:
      - the
      type: object
      properties:
        the:
          type: object
      example:
        the: {}
    Th:
      title: Th
      required:
      - canvas
      type: object
      properties:
        canvas:
          type: object
      example:
        canvas: {}
    MAdjgp:
      title: MAdjgp
      required:
      - t
      - a
      - th
      type: object
      properties:
        t:
          $ref: '#/components/schemas/T'
        a:
          $ref: '#/components/schemas/A'
        th:
          $ref: '#/components/schemas/Th1'
      example:
        t:
          in: {}
        a:
          the: {}
        th:
          bedroom: {}
    T:
      title: T
      required:
      - in
      type: object
      properties:
        in:
          type: object
      example:
        in: {}
    A:
      title: A
      required:
      - the
      type: object
      properties:
        the:
          type: object
      example:
        the: {}
    Th1:
      title: Th1
      required:
      - bedroom
      type: object
      properties:
        bedroom:
          type: object
      example:
        bedroom: {}
    sendinviterequest:
      title: sendinviterequest
      required:
      - AdminID
      - GroupID
      - Invite_TO
      - Status
      type: object
      properties:
        AdminID:
          type: string
        GroupID:
          type: integer
          format: int32
        Invite_TO:
          type: string
        Status:
          type: string
      example:
        AdminID: arti@071
        GroupID: 123456
        Invite_TO: arti@07
        Status: 'NULL'
  securitySchemes:
    apiKey:
      type: apiKey
      name: x-auth-token
      in: header
security: []
tags:
- name: User
- name: Groups
- name: Clauses
- name: Analysis
- name: Invite
